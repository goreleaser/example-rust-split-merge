# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# Used by the macOS runner only: both darwin targets must be built in the same
# run so universal_binaries can lipo them together.
version: 2

project_name: example-rust-split-merge

partial:
  by: goos

builds:
  - id: example-rust-split-merge
    builder: rust
    tool: cargo
    command: build
    binary: example-rust-split-merge
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin

universal_binaries:
  - id: example-rust-split-merge
    ids:
      - example-rust-split-merge
    replace: true

archives:
  - formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
