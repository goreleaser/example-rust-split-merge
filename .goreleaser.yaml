# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2

project_name: example-rust-split-merge

partial:
  by: goos

builds:
  - id: example-rust-split-merge
    builder: rust
    tool: cargo
    command: build
    binary: example-rust-split-merge
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-msvc
      - aarch64-pc-windows-msvc

universal_binaries:
  - ids:
      - example-rust-split-merge
    replace: true

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

# runs after a real release, not on snapshots: it downloads the published
# assets and checks them against the published checksums
verify:
  commands:
    - cmd: sha256sum
      args: ["-c", "checksums.txt"]
